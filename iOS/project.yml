name: PeerReview
options:
  bundleIdPrefix: com.shimondeitel.peerreview
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  PeerReview:
    type: application
    platform: iOS
    sources:
      - path: PeerReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.peerreview
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: PeerReview/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  PeerReviewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeerReviewTests
      - path: PeerReview.storekit
    dependencies:
      - target: PeerReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.peerreview.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  PeerReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PeerReviewUITests
    dependencies:
      - target: PeerReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.peerreview.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PeerReview:
    build:
      targets:
        PeerReview: all
        PeerReviewTests: [test]
        PeerReviewUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: PeerReview.storekit
    test:
      config: Debug
      storeKitConfiguration: PeerReview.storekit
      targets:
        - PeerReviewTests
        - PeerReviewUITests
    archive:
      config: Release
